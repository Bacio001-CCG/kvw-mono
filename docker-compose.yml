services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "7400:4000"
    env_file:
      - apps/backend/.env
    environment:
      PORT: "4000"
      ADMIN_ORIGIN: http://localhost:7002,http://localhost:7000

  public:
    build:
      context: .
      dockerfile: Dockerfile
      target: public
      args:
        NEXT_PUBLIC_API_URL: http://localhost:7400
    ports:
      - "7000:3000"
    environment:
      BACKEND_URL: http://backend:4000
      NEXT_PUBLIC_API_URL: http://localhost:7400
    depends_on:
      - backend

  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin
      args:
        NEXT_PUBLIC_API_URL: http://localhost:7400
    ports:
      - "7002:3002"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:7400
    depends_on:
      - backend
