services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kvw
    volumes:
      - kvw_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kvw"]
      interval: 3s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "${BACKEND_HOST_PORT:-7400}:${BACKEND_PORT:-4000}"
    env_file:
      - apps/backend/.env
    environment:
      PORT: ${BACKEND_PORT:-4000}
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:7002/api/backend}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:7002}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@kvw.local}
      ADMIN_NAME: ${ADMIN_NAME:-Beheerder}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-hekos-dev}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy

  public:
    build:
      context: .
      dockerfile: Dockerfile
      target: public
    ports:
      - "${PUBLIC_HOST_PORT:-7000}:${PUBLIC_PORT:-3000}"
    environment:
      PORT: ${PUBLIC_PORT:-3000}
      HOSTNAME: 0.0.0.0
      BACKEND_URL: http://backend:${BACKEND_PORT:-4000}
    depends_on:
      - backend

  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin
    ports:
      - "${ADMIN_HOST_PORT:-7002}:${ADMIN_PORT:-3002}"
    environment:
      PORT: ${ADMIN_PORT:-3002}
      HOSTNAME: 0.0.0.0
      BACKEND_URL: http://backend:${BACKEND_PORT:-4000}
    depends_on:
      - backend

volumes:
  kvw_postgres_data:
