services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "${BACKEND_HOST_PORT:-7400}:${BACKEND_PORT:-4000}"
    env_file:
      - apps/backend/.env
    environment:
      PORT: ${BACKEND_PORT:-4000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:7000,http://localhost:7002}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

  public:
    build:
      context: .
      dockerfile: Dockerfile
      target: public
    ports:
      - "${PUBLIC_HOST_PORT:-7000}:${PUBLIC_PORT:-3000}"
    environment:
      PORT: ${PUBLIC_PORT:-3000}
      HOSTNAME: 0.0.0.0
      BACKEND_URL: http://backend:${BACKEND_PORT:-4000}
    depends_on:
      - backend

  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin
    ports:
      - "${ADMIN_HOST_PORT:-7002}:${ADMIN_PORT:-3002}"
    environment:
      PORT: ${ADMIN_PORT:-3002}
      HOSTNAME: 0.0.0.0
      BACKEND_URL: http://backend:${BACKEND_PORT:-4000}
    depends_on:
      - backend
