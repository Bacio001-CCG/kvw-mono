services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "4000:4000"
    env_file:
      - apps/backend/.env
    environment:
      PORT: "4000"
      ADMIN_ORIGIN: http://localhost:3002

  public:
    build:
      context: .
      dockerfile: Dockerfile
      target: public
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - backend

  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3002:3002"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - backend
